        Verification / known gap: The date-scaled timeline occupies the full workspace without a redundant Attention panel, includes the project row and dated end marker, maps activities to their actual dates, and extends for post-project activity finishes. A fixed 18px-per-day scale uses light daily rules and bold labelled Monday rules, so the same distance always represents the same duration and longer schedules scroll horizontally. Sticky opaque row labels mask bars at the timeline boundary during horizontal scrolling. The project activity list shares the global filters, opens an activity from the whole row without a redundant Edit affordance, and uses the shared non-breaking secondary Add activity action. Activity details open first in the editor while the other compact sections remain collapsed until requested or validation requires them. Dependency connectors are intentionally excluded.
